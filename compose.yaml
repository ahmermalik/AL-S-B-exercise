services:
  web:
    build: .
    image: asset-living-close:local
    env_file: .env.local
    environment:
      NODE_ENV: production
      DATABASE_PATH: /var/lib/asset-living/close.sqlite
      SOURCE_WORKBOOK_PATH: /source/close-pack.xlsx
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - close-data:/var/lib/asset-living
      - ./data/source/close-pack.xlsx:/source/close-pack.xlsx:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
  worker:
    image: asset-living-close:local
    command: worker
    env_file: .env.local
    environment:
      NODE_ENV: production
      DATABASE_PATH: /var/lib/asset-living/close.sqlite
    volumes:
      - close-data:/var/lib/asset-living
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
volumes:
  close-data:
