name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: asset-living-close-production
  cancel-in-progress: false

env:
  DROPLET_HOST: 167.172.151.243
  DROPLET_USER: deploy
  DROPLET_HOST_KEY: 167.172.151.243 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAICSHkIfZSfNgSgK5fRHvFo8jhln33uWYMW7Bg2MYYLns
  PUBLIC_URL: https://asset-living-demo.foresyte.xyz

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/asset-living-close:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/asset-living-close:latest
          cache-from: type=gha,scope=asset-living-close
          cache-to: type=gha,mode=max,scope=asset-living-close

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DROPLET_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DROPLET_HOST_KEY" > ~/.ssh/known_hosts
      - name: Sync compose file
        run: |
          scp infra/deploy/compose.production.yaml \
            "$DROPLET_USER@$DROPLET_HOST:/home/deploy/asset-living-close/docker-compose.yml"
      - name: Deploy image
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" | ssh "$DROPLET_USER@$DROPLET_HOST" \
            "docker login ghcr.io -u '${{ github.actor }}' --password-stdin"
          ssh "$DROPLET_USER@$DROPLET_HOST" \
            "IMAGE_TAG='$RELEASE_SHA' bash -s" <<'REMOTE'
          set -eu
          cd /home/deploy/asset-living-close
          export IMAGE_TAG
          docker compose --env-file .env.production pull --quiet
          docker compose --env-file .env.production up -d --remove-orphans
          for attempt in $(seq 1 30); do
            web_health=$(docker inspect asset-living-close-web --format '{{.State.Health.Status}}' 2>/dev/null || true)
            worker_state=$(docker inspect asset-living-close-worker --format '{{.State.Status}}' 2>/dev/null || true)
            if [ "$web_health" = healthy ] && [ "$worker_state" = running ]; then
              echo "application containers healthy"
              break
            fi
            if [ "$attempt" = 30 ]; then
              docker compose --env-file .env.production ps
              docker logs --tail 100 asset-living-close-web || true
              docker logs --tail 100 asset-living-close-worker || true
              exit 1
            fi
            sleep 5
          done
          docker image prune -f
          docker logout ghcr.io
          REMOTE
      - name: Verify public application and existing services
        run: |
          curl -fsS --retry 10 --retry-delay 6 --retry-all-errors "$PUBLIC_URL/login" > /dev/null
          curl -fsS https://goodrotation.app/ > /dev/null
          curl -fsS https://souschef.foresyte.xyz/login > /dev/null

